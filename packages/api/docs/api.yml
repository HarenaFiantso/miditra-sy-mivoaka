openapi: 3.0.3
info:
  version: latest
  title: Mivoaka sy miditra
  description: A full-stack web application that enables users to track personal expenses and income, upload receipts, set up recurring expenses with a defined duration, and receive alerts when they exceed their monthly budget.

servers:
  - url: http://localhost:3000/api/v1

tags:
  - name: Health
    description: Endpoints to verify service health
  - name: Security
    description: Authentication and user management

paths:
  /health-check/hello:
    get:
      tags: [Health]
      summary: Should return Hello World.
      operationId: hello_world
      responses:
        '200':
          description: Return OK if API is healthy
          content:
            application/json:
              example: { message: 'Hello World' }
        '500':
          $ref: '#/components/responses/500'

  /health-check/ping:
    get:
      tags: [Health]
      summary: Should return ping.
      operationId: ping_pong
      responses:
        '200':
          description: Return Pong if API is healthy
          content:
            application/json:
              example: { message: 'Pong' }
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'

  /auth/login:
    post:
      tags: [Security]
      summary: Get JWT Token
      operationId: getToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: JWT token response
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '400': { $ref: '#/components/responses/400' }
        '500': { $ref: '#/components/responses/500' }

  /auth/register:
    post:
      tags: [Security]
      summary: Register user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
      responses:
        '201':
          description: User created successfully
        '400': { $ref: '#/components/responses/400' }
        '500': { $ref: '#/components/responses/500' }

  /whoami:
    get:
      tags: [Security]
      summary: Who am I? Tells you who you are.
      security:
        - BearerAuth: []
      operationId: whoami
      responses:
        '200':
          description: Who you are
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Whoami'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequestException'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotAuthorizedException'
    '404':
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceNotFoundException'
    '429':
      description: Too many requests to the API
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsException'
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerException'

  schemas:
    Login:
      type: object
      properties:
        email: { type: string }
        password: { type: string }

    Register:
      type: object
      properties:
        username: { type: string }
        email: { type: string }
        password: { type: string }

    Whoami:
      properties:
        id:
          type: string
        bearer:
          type: string

    Exception:
      type: object
      properties:
        type: { type: string }
        message: { type: string }

    BadRequestException:
      allOf: [{ $ref: '#/components/schemas/Exception' }]
      example: { type: BadRequestException, message: Bad request }

    NotAuthorizedException:
      allOf: [{ $ref: '#/components/schemas/Exception' }]
      example: { type: NotAuthorizedException, message: Not authorized }

    ResourceNotFoundException:
      allOf: [{ $ref: '#/components/schemas/Exception' }]
      example: { type: ResourceNotFoundException, message: Resource not found }

    TooManyRequestsException:
      allOf: [{ $ref: '#/components/schemas/Exception' }]
      example: { type: TooManyRequestsException, message: Too many requests }

    InternalServerException:
      allOf: [{ $ref: '#/components/schemas/Exception' }]
      example: { type: InternalServerException, message: Unexpected error }
